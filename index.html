<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Pour toi</title>
  <style>
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #ffb6c1, #ffe4e1);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      text-align: center;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      width: 320px;
    }

    img {
      width: 100%;
      border-radius: 15px;
      margin-bottom: 15px;
    }

    h1 {
      color: #ff4d88;
    }

    p {
      margin-bottom: 20px;
    }

    button {
      font-size: 18px;
      padding: 10px 20px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      position: relative;
    }

    #yes {
      background: #ff4d88;
      color: white;
      margin-right: 10px;
    }

    #no {
      background: #ddd;
      position: absolute;
    }

    #message-final {
      display: none;
      font-size: 20px;
      color: #ff4d88;
    }
  </style>
</head>
<body>

  <div class="card" id="card">
    <!-- 🔽 CHANGE L'IMAGE ICI -->
    <img src="ophelie-thomas.jpeg" alt="Nous 💛💙">

    <h1>Veux-tu être ma Valentine ? 💛</h1>
    <p>Tu n'as pas le droit de dire non à ton chat 😈</p>

    <button id="yes">Oui</button>
    <button id="no">Non</button>
  </div>

  <div class="card" id="message-final">
    <h1>OUIIIII 😍 ma lapine 🥰</h1>
    <p>
      On va passer un moment génial ensemble 💛💙<br>
      J’ai tellement hâte de partager cette première Saint-Valentin avec toi 🥰
    </p>
  </div>

<script>
  const noBtn = document.getElementById("no");
  const yesBtn = document.getElementById("yes");
  const card = document.getElementById("card");
  const finalMessage = document.getElementById("message-final");

  // Position initiale du bouton non
  noBtn.style.top = "260px";
  noBtn.style.left = "160px";

  noBtn.addEventListener("mouseover", () => {
    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 50);
    noBtn.style.left = `${x}px`;
    noBtn.style.top = `${y}px`;
  });

  yesBtn.addEventListener("click", () => {
    card.style.display = "none";
    finalMessage.style.display = "block";
  });
</script>

</body>
</html>
